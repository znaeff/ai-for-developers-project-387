# yaml-language-server: $schema=https://raw.githubusercontent.com/jdx/jactionlint/main/schema/jactionlint-config.json
profile: default

ignores:
  - rule: dangerous-triggers
    file: .github/workflows/opencode.yml
    reason: >-
      issue_comment is required by the documented OpenCode integration. The job
      is limited to the repository OWNER, uses OIDC app token exchange,
      read-only contents, no PR checkout and a single OPENCODE_API_KEY secret;
      a short-lived GITHUB_TOKEN scoped to issues: write is exposed as GH_TOKEN
      only so the gh CLI can publish issues.
    expires: "2027-05-21"
